<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LabelImage</title>
  <link rel="stylesheet" href="/static/css/style.css?v=12" />
</head>
<body>
  <header class="topbar">
    <div class="menus">
      <details>
        <summary>File</summary>
        <div class="menu">
          <p class="menu-hint">Browse opens a folder dialog. If it fails, paste the path and press Set.</p>
          <label>Images folder<input id="dirImages" placeholder="paste folder path" /></label>
          <div class="inline">
            <button id="browseImages" type="button">Browse</button>
            <button id="applyImagesDir" type="button">Set</button>
          </div>
          <label>Annotations folder<input id="dirLabels" placeholder="paste folder path" /></label>
          <div class="inline">
            <button id="browseLabels" type="button">Browse</button>
            <button id="applyLabelsDir" type="button">Set</button>
          </div>
        </div>
      </details>
      <details>
        <summary>Settings</summary>
        <div class="menu">
          <label class="row"><input id="trackChk" type="checkbox" /> Track Changes</label>
          <label>Box thickness<input id="boxTh" type="number" min="1" max="30" /></label>
          <label>Label size<input id="labSz" type="number" min="6" max="96" /></label>
          <label>Place box W×H
            <span class="inline">
              <input id="placeW" type="number" min="4" max="1024" />
              <input id="placeH" type="number" min="4" max="1024" />
            </span>
          </label>
          <label>Crop Focus level
            <span class="inline">
              <input id="cropFocusLevel" type="range" min="1" max="10" step="1" value="5" />
              <span id="cropFocusLevelVal">5</span>
            </span>
          </label>
          <label>New box class<select id="newCls"></select></label>
          <button id="setClasses">Set classes</button>
          <label class="row"><input id="darkChk" type="checkbox" checked /> Dark mode</label>
        </div>
      </details>
      <details>
        <summary>Filter & Sort</summary>
        <div class="menu">
          <label class="row"><input id="enableClassFilter" type="checkbox" checked /> Class Type Filtering</label>
          <label class="row"><input id="enableClusterSort" type="checkbox" /> Cluster Sorting</label>
          <label class="row"><input id="enableSizeFilter" type="checkbox" /> Box Size Filtering</label>
        </div>
      </details>
      <details>
        <summary>Post Process</summary>
        <div class="menu">
          <label class="row"><input type="checkbox" class="fchk" data-f="gamma" checked /> Gamma</label>
          <label class="row"><input type="checkbox" class="fchk" data-f="clahe" /> CLAHE</label>
          <label class="row"><input type="checkbox" class="fchk" data-f="unsharp" /> Unsharp</label>
          <label class="row"><input type="checkbox" class="fchk" data-f="emboss" /> Emboss</label>
        </div>
      </details>
    </div>
    <div class="topbar-center">
      <div id="multiBoxWarn" class="multi-box-warn hidden"></div>
    </div>
    <nav class="tabs">
      <button class="tab on" data-page="viewer">Single Image</button>
      <button class="tab" data-page="crop">Crops</button>
    </nav>
  </header>

  <div id="filterBar" class="tools filter-bar">
    <span id="classFilterWrap">
      <select id="classFilter"></select>
    </span>
    <span id="clusterSortWrap" class="hidden">
      <label class="row"><input type="radio" name="sort" value="name" checked /> Sort by Name</label>
      <label class="row"><input type="radio" name="sort" value="cluster" /> Sort by Cluster</label>
      <label class="row"><input type="radio" name="sort" value="size_asc" /> Sort Smallest to Biggest</label>
      <label class="row"><input type="radio" name="sort" value="size_desc" /> Sort Biggest to Smallest</label>
      <button id="clusterBtn">Cluster Dataset</button>
    </span>
    <span id="sizeFilterWrap" class="hidden">
      <label class="row">Size min <input id="sizeMin" type="range" min="0" max="1" step="0.01" value="0" /> <span id="sizeMinVal">0.00</span></label>
      <label class="row">Size max <input id="sizeMax" type="range" min="0" max="1" step="0.01" value="1" /> <span id="sizeMaxVal">1.00</span></label>
    </span>
  </div>

  <section id="pageViewer" class="page on">
    <aside class="nav collapsed" id="navPanel">
      <div class="nav-head">
        <h2>Navigation</h2>
        <button type="button" id="navToggle" class="nav-toggle" title="Expand">&#9654;</button>
      </div>
      <div class="nav-body">
        <div class="nav-btns">
          <button id="prevBtn">Previous</button>
          <button id="nextBtn">Next</button>
        </div>
        <div class="jump" id="jumpRow">
          <input id="jumpEdit" placeholder="image #" />
          <button id="goBtn">Go</button>
        </div>
        <select id="clusterJump" class="hidden"></select>
        <div id="navList" class="nav-list"></div>
      </div>
    </aside>
    <div id="navSplit" class="nav-split" title="Drag to resize"></div>
    <div class="main">
      <div class="tools">
        <label class="row"><input id="showBoxes" type="checkbox" checked /> Boxes</label>
        <label class="row"><input id="showLabels" type="checkbox" checked /> Labels</label>
        <label class="row"><input id="cropFocus" type="checkbox" /> Crop Focus</label>
        <button id="editBtn" class="mode">Edit (E)</button>
        <button id="removeBtn" class="mode">Remove (R)</button>
        <button id="placeBtn" class="mode">Place Box (Q)</button>
        <button id="statsBtn">Stats</button>
        <span class="grow"></span>
        <button id="checkedBtn" class="hidden checked">Image Checked (C)</button>
        <button id="fitBtn">Fit Image (F)</button>
        <button id="delBtn" class="danger">Delete Image</button>
      </div>
      <div class="stage">
        <canvas id="cv"></canvas>
        <div id="filterPanel" class="filter-panel hidden">
          <div id="filterRadios"></div>
          <div id="filterSliders"></div>
        </div>
      </div>
      <div id="status" class="status">
        <div class="status-paths">
          <div id="statusImg" class="status-path"></div>
          <div id="statusLab" class="status-path"></div>
        </div>
        <div class="status-sep"></div>
        <div id="statusLine" class="status-line"></div>
      </div>
    </div>
  </section>

  <section id="pageCrop" class="page">
    <div class="crop-bar">
      <select id="cropShow">
        <option value="100" selected>Show 100</option>
        <option value="500">Show 500</option>
        <option value="all">Show All</option>
      </select>
      <span id="cropStatus">0 crops loaded</span>
    </div>
    <div id="cropGrid" class="crop-grid"></div>
  </section>

  <div id="cropPopup" class="crop-popup hidden">
    <div class="crop-popup-box">
      <div class="crop-popup-head">
        <span id="cropPopupTitle">Crop</span>
        <button id="cropPopupClose" type="button">Close</button>
      </div>
      <div class="crop-popup-tools tools">
        <label class="row"><input id="cropPShowBoxes" type="checkbox" checked /> Boxes (B)</label>
        <label class="row"><input id="cropPShowLabels" type="checkbox" checked /> Labels (L)</label>
        <button id="cropPEditBtn" class="mode">Edit (E)</button>
        <button id="cropPRemoveBtn" class="mode">Remove (R)</button>
        <button id="cropPPlaceBtn" class="mode">Place Box (Q)</button>
      </div>
      <div class="crop-popup-body">
        <canvas id="cropPopupCv"></canvas>
      </div>
    </div>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <pre id="modalText"></pre>
      <div id="modalExtra"></div>
      <button id="modalOk">OK</button>
    </div>
  </div>
  <script src="/static/js/app.js?v=20"></script>
</body>
</html>
